kind = "mobile"
previewPath = "/"
title = "Plant Pal"
description = "A mobile plant companion that helps users care for a virtual plant, follow timely watering guidance, and connect to an Arduino-compatible BLE sensor."
version = "1.0.0"
id = "artifacts/plant-tamagotchi"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 23139

[services.development]
run = "pnpm --filter @workspace/plant-tamagotchi run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/plant-tamagotchi", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/plant-tamagotchi", "run", "serve" ]

[services.env]
PORT = "23139"
BASE_PATH = "/"
